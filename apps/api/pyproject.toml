[project]
name = "long-horizon-dashboard-api"
version = "0.1.0"
description = "API and data foundation for the Long Horizon Decision Dashboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "pypdf>=5.9,<6",
  "sqlalchemy>=2.0.51,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
